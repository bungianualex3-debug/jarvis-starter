<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel</title>
<style>
  /* Every colour on screen is the one accent, black, or white — the accent
     variants below are computed from CONFIG.accent at boot, so re-theming is
     still a one-line change. */
  :root {
    --accent: #ff4d3d;
    --accent-soft: rgba(255, 77, 61, 0.35);
    --accent-faint: rgba(255, 77, 61, 0.16);
    --accent-ghost: rgba(255, 77, 61, 0.10);
    --ink: rgba(255, 255, 255, 0.86);
    --ink-mid: rgba(255, 255, 255, 0.56);
    --ink-dim: rgba(255, 255, 255, 0.34);
    --glass: rgba(9, 11, 15, 0.74);
    --line: rgba(255, 255, 255, 0.08);
    --gap: clamp(10px, 0.9vw, 16px);
    --pad: clamp(12px, 1vw, 18px);
    --fs: clamp(12px, 0.86vw, 15px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: var(--fs);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; position: fixed; inset: 0; z-index: 0; }
  button, input { font: inherit; color: inherit; }

  /* ------------------------------------------------------------------
     LAYOUT — one screen, three columns under a top bar. Left: who it is
     and what waits on you. Middle: the stage, where it shows its work.
     Right: what it remembered, and the conversation.
  ------------------------------------------------------------------ */
  #app {
    position: fixed; inset: 0; z-index: 2;
    display: grid;
    grid-template-columns: minmax(230px, 20vw) minmax(0, 1fr) minmax(300px, 27vw);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top top top" "left mid right";
    gap: var(--gap);
    padding: clamp(12px, 1.4vw, 26px);
  }
  #top   { grid-area: top; display: flex; align-items: center; gap: var(--gap); min-height: clamp(48px, 5.4vh, 66px); }
  #left  { grid-area: left;  display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
  #mid   { grid-area: mid;   display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
  #right { grid-area: right; display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }

  .card {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: var(--pad);
    min-height: 0;
    position: relative;
  }
  .lbl, h4 {
    font-size: 0.74em;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  h4 { margin-bottom: 0.9em; display: flex; align-items: center; gap: 0.7em; }
  h4 i { font-style: normal; color: var(--accent); opacity: 0.85; letter-spacing: 0.08em; }

  /* --- top bar --- */
  #brand { letter-spacing: 0.22em; text-transform: uppercase; font-size: 0.9em; white-space: nowrap; }
  #brand b { color: var(--ink); font-weight: 600; font-size: 1.15em; }
  #brand span { display: block; margin-top: 0.4em; color: var(--accent); font-size: 0.8em; }
  #goal {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 1em;
    padding: 0.75em 1.1em;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  #goalText { flex: 1; min-width: 0; font-size: 1.12em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #goal.done #goalText { color: var(--ink-dim); text-decoration: line-through; }
  #goalDone {
    width: 1.7em; height: 1.7em; flex: none;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--accent-soft);
    color: var(--accent);
    cursor: pointer;
    transition: background 200ms ease;
  }
  #goalDone:hover { background: var(--accent-ghost); }
  #goal.done #goalDone { background: var(--accent-faint); }
  #when { text-align: right; white-space: nowrap; }
  #clock { font-size: clamp(22px, 2.1vw, 38px); font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; line-height: 1; }
  #date { margin-top: 0.45em; font-size: 0.82em; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); }

  /* --- left --- */
  #presenceCard {
    background: transparent;            /* the presence is drawn on the canvas behind */
    flex: 0 0 auto;
    aspect-ratio: 1 / 0.92;
    display: flex; flex-direction: column; justify-content: flex-end;
    overflow: hidden;
  }
  #presence { position: absolute; inset: 0 0 18% 0; }
  #cap { min-height: 3.1em; max-height: 4.5em; overflow: hidden; text-align: center; opacity: 0; transition: opacity 260ms ease; }
  #cap.on { opacity: 1; }
  #cap .line { font-size: 0.95em; line-height: 1.45; color: var(--ink-dim); text-wrap: balance; }
  #cap .w { transition: color 90ms linear; }
  #cap .w.lit { color: var(--ink); }

  #waitCard { flex: 1 1 0; display: flex; flex-direction: column; }
  ul { list-style: none; }
  #waitList { overflow-y: auto; flex: 1; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--accent-faint) transparent; }
  #waitList li {
    position: relative;
    padding: 0.55em 0 0.55em 1.3em;
    border-top: 1px solid var(--line);
    line-height: 1.4;
    color: var(--ink);
  }
  #waitList li:first-child { border-top: 0; }
  #waitList li::before {
    content: ""; position: absolute; left: 0.15em; top: 1.05em;
    width: 0.45em; height: 0.45em; border-radius: 50%;
    border: 1px solid var(--accent);
  }
  .empty { color: var(--ink-dim); font-style: italic; padding: 0.4em 0; }

  #noteCard { flex: 0 0 auto; }
  #noteIn, #chatin {
    width: 100%;
    padding: 0.7em 1em;
    border-radius: 1.4em;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    outline: none;
    caret-color: var(--accent);
    transition: border-color 300ms ease, box-shadow 300ms ease, background 300ms ease;
  }
  #noteIn::placeholder, #chatin::placeholder { color: rgba(255, 255, 255, 0.26); letter-spacing: 0.04em; }
  #noteIn:focus, #chatin:focus { border-color: var(--accent-soft); background: rgba(255, 255, 255, 0.06); box-shadow: 0 0 14px var(--accent-ghost); }
  #noteMsg, #chatnote { margin-top: 0.5em; min-height: 1.2em; font-size: 0.85em; letter-spacing: 0.06em; color: var(--accent); opacity: 0; transition: opacity 350ms ease; }
  #noteMsg.on, #chatnote.on { opacity: 0.8; }

  /* --- middle: the stage --- */
  #stageCard { flex: 1 1 0; display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  #stageHead { display: flex; align-items: baseline; gap: 1em; padding: var(--pad) var(--pad) 0.8em; }
  #stageHead h4 { margin: 0; }
  #stageTitle { color: var(--ink-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stage { position: relative; flex: 1; min-height: 0; border-top: 1px solid var(--line); overflow: hidden; }
  .sheet {
    position: absolute; inset: 0;
    padding: clamp(18px, 2.2vw, 42px);
    overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--accent-faint) transparent;
    animation: turnIn 720ms cubic-bezier(0.2, 0.7, 0.1, 1) both;
    transform-origin: left center;
  }
  .sheet.leaving { animation: turnOut 380ms ease-in both; pointer-events: none; }
  @keyframes turnIn {
    from { opacity: 0; transform: perspective(1400px) rotateY(-14deg) translateX(3%); clip-path: inset(0 100% 0 0); }
    to   { opacity: 1; transform: none; clip-path: inset(0 0 0 0); }
  }
  @keyframes turnOut {
    from { opacity: 1; transform: none; }
    to   { opacity: 0; transform: perspective(1400px) rotateY(10deg) translateX(-2%); }
  }
  .sheet h2 { font-size: clamp(20px, 1.9vw, 34px); font-weight: 300; letter-spacing: 0.01em; margin-bottom: 0.7em; line-height: 1.2; }
  .sheet h2 em { font-style: normal; color: var(--accent); }
  .sheet p { font-size: 1.14em; line-height: 1.6; color: var(--ink); margin-bottom: 0.9em; max-width: 62ch; }
  .sheet .rows { display: grid; gap: 0.2em; max-width: 70ch; }
  .sheet .rows div { display: flex; gap: 1em; padding: 0.6em 0; border-top: 1px solid var(--line); font-size: 1.1em; line-height: 1.45; }
  .sheet .rows div b { flex: none; min-width: 4.2em; font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
  .sheet .big { display: flex; gap: clamp(18px, 3vw, 56px); margin: 0.4em 0 1.4em; flex-wrap: wrap; }
  .sheet .big div { min-width: 6em; }
  .sheet .big b { display: block; font-size: clamp(30px, 3.4vw, 60px); font-weight: 200; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .sheet .big span { display: block; margin-top: 0.6em; font-size: 0.78em; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim); }
  .sheet img { max-width: 100%; max-height: 100%; display: block; margin: 0 auto; border-radius: 8px; }
  .sheet.frame { padding: 0; }
  .sheet iframe { width: 100%; height: 100%; border: 0; background: #0b0d12; }

  #shelf { flex: 0 0 auto; display: flex; gap: 0.6em; overflow-x: auto; scrollbar-width: none; min-height: 2.7em; }
  #shelf::-webkit-scrollbar { display: none; }
  #shelf button {
    flex: none; max-width: 17em;
    padding: 0.55em 1em;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink-mid);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer;
    transition: border-color 200ms ease, color 200ms ease;
    animation: rise 420ms ease both;
  }
  #shelf button:hover { color: var(--ink); border-color: var(--accent-soft); }
  #shelf button.on { color: var(--ink); border-color: var(--accent-soft); background: var(--accent-ghost); }
  #shelf button i { font-style: normal; color: var(--accent); margin-right: 0.6em; font-size: 0.78em; letter-spacing: 0.14em; text-transform: uppercase; }

  #doing {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 0.9em;
    padding: 0.8em 1.1em;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 12px;
    min-height: 3em;
  }
  #doing .dot { width: 0.55em; height: 0.55em; border-radius: 50%; background: var(--ink-dim); flex: none; }
  #doing.busy .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  #doingText { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-mid); }
  #doing.busy #doingText { color: var(--ink); }
  #doingText.swap { animation: rise 320ms ease both; }
  @keyframes pulse { 50% { opacity: 0.35; transform: scale(0.8); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* --- right --- */
  #memCard { flex: 0 1 34%; display: flex; flex-direction: column; }
  #memList { overflow-y: auto; flex: 1; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--accent-faint) transparent; }
  #memList li { display: flex; gap: 0.9em; padding: 0.5em 0; border-top: 1px solid var(--line); line-height: 1.4; animation: rise 420ms ease both; }
  #memList li:first-child { border-top: 0; }
  #memList li b { flex: none; font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; opacity: 0.9; }
  #memList li span { color: var(--ink); }

  /* the conversation: the engine's chat, brought permanently forward */
  #chat { flex: 1 1 0; display: flex; flex-direction: column; opacity: 1; }
  #log {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 0.5em;
    overflow-y: auto; overscroll-behavior: contain;
    padding: 0.2em 0.3em 0.8em 0.1em;
    scrollbar-width: thin; scrollbar-color: var(--accent-faint) transparent;
  }
  #log::-webkit-scrollbar { width: 4px; }
  #log::-webkit-scrollbar-thumb { background: var(--accent-faint); border-radius: 2px; }
  .msg {
    max-width: 90%;
    padding: 0.5em 0.85em 0.55em;
    border-radius: 0.9em;
    line-height: 1.45;
    word-break: break-word;
    user-select: text;
    opacity: 0; transform: translateY(5px);
    transition: opacity 350ms ease, transform 350ms ease;
  }
  .msg.in { opacity: 1; transform: none; }
  .msg.ai { align-self: flex-start; border-bottom-left-radius: 0.25em; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.07); }
  .msg.user { align-self: flex-end; border-bottom-right-radius: 0.25em; background: var(--accent-ghost); border: 1px solid var(--accent-soft); }
  .msg.failed { opacity: 0.4; border-style: dashed; }
  .msg.pending { opacity: 0.55; }
  #quick { display: flex; flex-wrap: wrap; gap: 0.5em; padding: 0.2em 0 0.8em; }
  #quick button {
    padding: 0.42em 0.9em;
    background: transparent;
    border: 1px solid var(--accent-soft);
    border-radius: 1.2em;
    color: var(--ink);
    font-size: 0.92em;
    cursor: pointer;
    transition: background 200ms ease, transform 120ms ease;
  }
  #quick button:hover { background: var(--accent-ghost); }
  #quick button:active { transform: scale(0.96); }

  #notice {
    position: fixed; bottom: 4px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.24); z-index: 3; user-select: none;
  }

  /* ------------------------------------------------------------------
     THE ENTRANCE — the board does not just appear. The sky is there
     first, then the pieces arrive one after another.
  ------------------------------------------------------------------ */
  .boot { opacity: 0; transform: translateY(14px) scale(0.985); }
  body.on .boot { animation: arrive 780ms cubic-bezier(0.2, 0.7, 0.1, 1) both; animation-delay: calc(var(--i, 0) * 110ms + 500ms); }
  @keyframes arrive {
    0%   { opacity: 0; transform: translateY(14px) scale(0.985); border-color: var(--accent-soft); }
    60%  { opacity: 1; border-color: var(--accent-soft); }
    100% { opacity: 1; transform: none; }
  }
  #veil { position: fixed; inset: 0; background: #000; z-index: 1; pointer-events: none; transition: opacity 1600ms ease; }
  body.on #veil { opacity: 0; }

  /* a narrow window: stack it rather than squeeze it */
  @media (max-width: 900px) {
    html, body { overflow: auto; }
    #app { position: static; grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: "top" "left" "mid" "right"; }
    #stageCard { min-height: 60vh; }
    #chat { min-height: 60vh; }
    #goal { order: 3; flex-basis: 100%; }
    #top { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"></div>
<div id="app">
  <header id="top">
    <div id="brand" class="boot" style="--i:0"><b>JARVIS</b><span id="statelabel">idle</span></div>
    <div id="goal" class="boot" style="--i:1">
      <span class="lbl" id="goalLbl"></span>
      <span id="goalText"></span>
      <button id="goalDone" type="button" aria-label="done">&#10003;</button>
    </div>
    <div id="when" class="boot" style="--i:2"><div id="clock">--:--</div><div id="date"></div></div>
  </header>

  <aside id="left">
    <section class="card boot" id="presenceCard" style="--i:3">
      <div id="presence"></div>
      <div id="cap"><div class="line" id="capline"></div></div>
    </section>
    <section class="card boot" id="waitCard" style="--i:5">
      <h4 id="waitLbl"></h4>
      <ul id="waitList"></ul>
    </section>
    <section class="card boot" id="noteCard" style="--i:7">
      <h4 id="noteLbl"></h4>
      <input id="noteIn" type="text" maxlength="600" spellcheck="false" autocomplete="off">
      <div id="noteMsg"></div>
    </section>
  </aside>

  <main id="mid">
    <section class="card boot" id="stageCard" style="--i:4">
      <div id="stageHead"><h4 id="stageLbl"></h4><span id="stageTitle"></span></div>
      <div id="stage"></div>
    </section>
    <div id="shelf" class="boot" style="--i:8"></div>
    <div id="doing" class="boot" style="--i:9"><span class="dot"></span><span class="lbl" id="doingLbl"></span><span id="doingText"></span></div>
  </main>

  <aside id="right">
    <section class="card boot" id="memCard" style="--i:6">
      <h4 id="memLbl"></h4>
      <ul id="memList"></ul>
    </section>
    <section class="card boot" id="chat" style="--i:8">
      <h4 id="chatLbl"></h4>
      <div id="log"></div>
      <div id="quick"></div>
      <input id="chatin" type="text" maxlength="2000" spellcheck="false" autocomplete="off">
      <div id="chatnote"></div>
    </section>
  </aside>
</div>
<div id="notice"></div>

<script>
/* ------------------------------------------------------------------
   CONFIG — everything a person is likely to want to change lives here.
   Change a value, save, reload. Nothing below this block needs touching
   to re-theme the whole thing.
------------------------------------------------------------------ */
const CONFIG = {
  name:      "JARVIS",     // shown top-left
  accent:    "#ff4d3d",    // the one colour the whole interface is built from
  presence:  "ring",       // "ring" | "orb" | "bars"  — the shape in the middle
  size:      0.18,         // only used if the presence card is missing from the page
  showClock: true,
  showState: true,
  showCaptions: true,
  showChat:  true,         // the conversation, on the right
  owner:     "",           // their name, for the greeting; empty = no name
  particles: 260,          // how many stars in the sky; 0 turns the sky off
  constellations: true,    // let nearby stars link into faint figures now and then
  shootingStars: true,     // meteors crossing the whole screen, every 8–20s
  nebula: true,            // slow drifting clouds of light behind the stars
  nebulaCount: 5,          // how many. more than ~7 and it stops being subtle
  source:    "/state",     // where live state is polled from; demo mode if absent
  sendTo:    "/say",       // typed messages are POSTed here as {"text": "..."}
  pollMs:    100
};

/* Labels for everything written on screen, so this file can be translated
   in one place. */
const LABELS = {
  idle: "idle", listening: "listening", thinking: "thinking", speaking: "speaking",
  demo: "demo mode",
  chatPlaceholder: "type to talk",
  chatOffline: "demo mode — not connected yet",
  /* --- the panel --- */
  locale: "en-GB",
  goal: "Today",
  goalEmpty: "No goal yet — tell me the one thing that matters today",
  goalDoneMsg: "Today's goal is done. Mark it.",
  waiting: "Waiting on you",
  waitingEmpty: "Nothing is waiting on you",
  note: "Quick note",
  notePlaceholder: "a thought to file away",
  noteSaved: "filed",
  notePrefix: "Quick note, file it where it belongs: ",
  stage: "Stage",
  doing: "Now",
  doingIdle: "Ready",
  memory: "Remembered today",
  memoryEmpty: "Nothing written down yet today",
  chat: "Conversation",
  greet: ["Good morning", "Good afternoon", "Good evening"],
  brief: { title: "Start of day", open: "open", waiting: "waiting on you", remembered: "remembered today", goalRow: "Today" },
  kinds: { text: "note", rows: "list", page: "page", image: "image", brief: "brief" },
  demoThinking: "Thinking it through",
  demoUser: "Can you hear me if I just type?",
  demoLine: "This is what I look like when I am talking to you.",
  /* the quick buttons: `text` is what gets sent, `reply` and `stage` are only
     what the demo plays back when nothing is connected */
  quick: [
    { label: "Plan my day", text: "Plan my day around today's goal.",
      reply: "Here is a plan built around your one goal. The first block starts now.",
      stage: { kind: "rows", title: "Plan for today", heading: "Plan for today",
               rows: [["09:00", "The hard part of today's goal, while you're fresh"],
                      ["11:00", "The two things waiting on you"],
                      ["13:00", "Break"],
                      ["14:00", "Finish the goal and check it"],
                      ["16:30", "I write up the day and what moves to tomorrow"]] } },
    { label: "What's still open?", text: "What is still open?",
      reply: "Four things are open. Two of them are waiting on you, not on me." },
    { label: "What did we decide?", text: "What did we decide most recently?",
      reply: "The last decision I wrote down is on the stage, with the time you made it.",
      stage: { kind: "text", title: "Last decision", heading: "The last decision",
               body: ["Yesterday at 18:40 you decided to send the offer with the lower price and no deadline.",
                      "I wrote it into the project note the moment you said it, so today starts from there instead of from memory."] } },
    { label: "Save this", text: "Save what we just talked about in the right note.",
      reply: "Saved. It's in the project note, with the time." }
  ],
  demoPanel: {
    length: 44,
    goal: "Send the offer to the first client",
    waiting: ["Confirm the price before I send the offer",
              "Record the 30-second intro for the page",
              "Choose one of the three suppliers"],
    open: ["Write the offer email", "Fix the pricing page", "Answer the two questions from Monday", "Back up the vault"],
    memory: [{ t: "08:52", text: "Decision: the offer goes out today, lower price, no deadline" },
             { t: "08:40", text: "Yesterday's note was missing the call with Dan — added" }],
    steps: [
      { at: 5,  activity: "Reading yesterday's note", busy: true },
      { at: 9,  activity: "Checking what is still open", busy: true },
      { at: 13, activity: "Writing the offer email", busy: true },
      { at: 19, activity: "", memory: "Draft of the offer email saved in the project note",
        stage: { kind: "text", title: "Offer email — draft", heading: "Offer email, first draft",
                 body: ["Hi Dan, as promised, here is the offer in one page.",
                        "You get the full setup on your own machine, built around how you work, and it stays yours. One price, paid once.",
                        "If the price is right, say yes and I'll book the install this week."] } },
      { at: 25, activity: "Comparing the three supplier quotes", busy: true },
      { at: 30, activity: "", memory: "Supplier check: two of the three can deliver this week",
        stage: { kind: "rows", title: "Suppliers compared", heading: "The three suppliers, compared",
                 rows: [["North", "Cheapest, delivers Thursday, 30 days to pay"],
                        ["Vale", "Mid price, delivers in two weeks — too late for this order"],
                        ["Brook", "Most expensive, delivers tomorrow, pays for itself on a rush"]] } },
      { at: 36, activity: "Updating the list of what waits on you", busy: true },
      { at: 40, activity: "" }
    ]
  }
};

/* ------------------------------------------------------------------
   Everything below is the engine. It is deliberately one file, no
   dependencies, and no build step: what you read is what runs.

   The look is a night sky: stars at three implied depths drifting with
   parallax, constellations that form and dissolve, and the presence at
   the centre. States are told apart by MOVEMENT, never by colour —
   listening pulls the sky gently inward, speaking pushes it out, and
   thinking is the sky connecting its dots.
------------------------------------------------------------------ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;

/* --- colour: one accent, derived into everything else --- */
function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex.trim());
  return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [255, 77, 61];
}
const ACC = hexToRgb(CONFIG.accent);
/* rgba(alpha, tint): tint 1 = pure accent, tint 0 = white. Most of the sky
   sits at low tint so the accent reads as a wash, not a flood. */
const rgba = (a, tint = 1) =>
  `rgba(${Math.round(lerp(255, ACC[0], tint))},${Math.round(lerp(255, ACC[1], tint))},${Math.round(lerp(255, ACC[2], tint))},${a})`;

const rootStyle = document.documentElement.style;
rootStyle.setProperty('--accent', CONFIG.accent);
rootStyle.setProperty('--accent-soft', rgba(0.35));
rootStyle.setProperty('--accent-faint', rgba(0.16));
rootStyle.setProperty('--accent-ghost', rgba(0.10));

/* --- canvas --- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
/* where the presence lives: measured from its card, so the layout decides */
const slot = { cx: 0, cy: 0, R: 0 };
function measureSlot() {
  const el = document.getElementById('presence');
  if (!el) { slot.cx = W / 2; slot.cy = H / 2; slot.R = Math.min(W, H) * CONFIG.size; return; }
  const r = el.getBoundingClientRect();
  slot.cx = r.left + r.width / 2;
  slot.cy = r.top + r.height / 2;
  slot.R = Math.min(r.width, r.height) * 0.27;
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  measureSlot();
  buildSky();
}
window.addEventListener('resize', resize);

/* --- state ---
   Four states, and a weight for each that eases rather than snaps, so the
   interface never changes shape in a single frame. Everything drawn reads
   the weights, not the state name. */
const st = {
  state: 'idle',
  level: 0,                       // 0..1 live loudness
  wave: new Array(64).fill(0),    // 64-point waveform
  w: { idle: 1, listening: 0, thinking: 0, speaking: 0 },
  capText: '', capSeq: -1, capDur: 0, capStart: 0,
  demo: false
};

function setWeights(dt) {
  const target = { idle: 0, listening: 0, thinking: 0, speaking: 0 };
  target[st.state] = 1;
  const k = 1 - Math.pow(0.001, dt);       // frame-rate independent easing
  for (const key in st.w) st.w[key] = lerp(st.w[key], target[key], k);
}

/* --- source: live if something answers, demo if nothing does --- */
async function poll() {
  if (!CONFIG.source) { st.demo = true; return; }
  try {
    const r = await fetch(CONFIG.source, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    st.demo = false;
    if (d.state && st.w.hasOwnProperty(d.state)) st.state = d.state;
    if (Array.isArray(d.wave) && d.wave.length) st.wave = d.wave;
    if (typeof d.level === 'number') st.level = clamp(d.level, 0, 1);
    if (d.caption && d.caption.seq !== st.capSeq) {
      st.capSeq = d.caption.seq;
      st.capText = d.caption.text || '';
      st.capDur = +d.caption.dur || 0;
      st.capStart = performance.now();
      renderCaption();
    }
    /* absent-safe: a source that doesn't send a conversation just means the
       chat log stays as it is — everything else keeps working */
    if (Array.isArray(d.conversation)) chat.sync(d.conversation);
    if (d.panel && typeof d.panel === 'object') panel.sync(d.panel);
  } catch (e) {
    st.demo = true;                          // nothing listening — that's fine
  }
}

/* Poll fast when something is answering, slowly when nothing is. Without the
   back-off a source that isn't running yet throws a 404 ten times a second
   forever, and the first thing anyone opening the console sees is a wall of
   red that isn't actually a problem. */
async function pollLoop() {
  await poll();
  setTimeout(pollLoop, st.demo ? 3000 : CONFIG.pollMs);
}
pollLoop();

/* --- demo loop: a slow scripted cycle so the interface is alive with no
   backend at all. It is the honest fallback, not a fake: the state line
   says so (and the notice line takes over if the state line is hidden). --- */
const DEMO_SCRIPT = [
  ['idle', 4200, ''],
  ['listening', 2600, ''],
  ['thinking', 2400, ''],
  ['speaking', 5200, LABELS.demoLine],
  ['idle', 2600, '']
];
/* the demo also plays a small typed exchange, so the chat panel shows what
   it's for without a backend. Wiped and replayed each cycle. */
const DEMO_CHAT_USER = LABELS.demoUser;
let demoAt = 0, demoUntil = 0;

function demoStep(now) {
  if (!st.demo) return;
  if (now < demoUntil) return;
  const idx = demoAt % DEMO_SCRIPT.length;
  const [state, ms, line] = DEMO_SCRIPT[idx];
  demoAt++;
  st.state = state;
  demoUntil = now + ms;
  if (idx === 0) chat.demoClear();
  if (state === 'listening') chat.demoPush('user', DEMO_CHAT_USER);
  if (line) {
    st.capText = line;
    st.capDur = ms / 1000;
    st.capStart = now;
    renderCaption();
    chat.demoPush('ai', line);
  } else if (state !== 'speaking') {
    st.capText = '';
    renderCaption();
  }
}

function demoSignal(now) {
  if (!st.demo) return;
  const t = now / 1000;
  if (st.state === 'speaking') {
    st.level = 0.35 + 0.35 * Math.abs(Math.sin(t * 5.1)) + 0.2 * Math.abs(Math.sin(t * 11.7));
    for (let i = 0; i < 64; i++) {
      st.wave[i] = Math.sin(t * 9 + i * 0.42) * 0.5 * st.level
                 + Math.sin(t * 21 + i * 1.13) * 0.25 * st.level;
    }
  } else if (st.state === 'listening') {
    st.level = 0.14 + 0.12 * Math.abs(Math.sin(t * 2.3));
    for (let i = 0; i < 64; i++) st.wave[i] = Math.sin(t * 3 + i * 0.3) * 0.12;
  } else {
    st.level = lerp(st.level, 0, 0.06);
    for (let i = 0; i < 64; i++) st.wave[i] *= 0.9;
  }
}

/* --- captions: the lit word tracks real playback time when the source
   tells us how long the line is, and falls back to pacing by length. --- */
const capEl = document.getElementById('cap');
const capLine = document.getElementById('capline');
let capWords = [];

function renderCaption() {
  if (!CONFIG.showCaptions || !st.capText) {
    capEl.classList.remove('on');
    capLine.textContent = '';
    capWords = [];
    return;
  }
  capLine.innerHTML = '';
  capWords = st.capText.split(/\s+/).filter(Boolean).map(word => {
    const s = document.createElement('span');
    s.className = 'w';
    s.textContent = word + ' ';
    capLine.appendChild(s);
    return s;
  });
  capEl.classList.add('on');
}

function sweepCaption(now) {
  if (!capWords.length) return;
  let prog;
  if (st.capDur > 0.05) {
    prog = clamp((now - st.capStart) / (st.capDur * 1000), 0, 1);
  } else {
    prog = clamp((now - st.capStart) / (capWords.length * 340), 0, 1);
  }
  const lit = Math.floor(prog * capWords.length);
  for (let i = 0; i < capWords.length; i++) {
    capWords[i].classList.toggle('lit', i <= lit);
  }
}

/* ------------------------------------------------------------------
   THE SKY — stars, constellations, and the odd meteor.

   Depth comes from parallax, not perspective math: each star carries a
   z in 0..1, and z scales its size, brightness and drift speed together,
   which is all the eye needs. The whole field also leans with the state:
   inward while listening (the sky drawing closer to hear), outward while
   speaking. The leans are tiny on purpose — they register as life, not
   as an effect.
------------------------------------------------------------------ */
let stars = [];
let cons = [];                    // live constellations (they reference stars)
let meteors = [];
let meteorNextAt = 0;

/* --- the nebula: clouds of light behind everything ---
   This is what stops a black background reading as *empty* rather than as
   deep. Each cloud is the SAME soft blob, drawn once into a small offscreen
   canvas and then stamped at different sizes, angles and opacities. That
   matters for speed: building a full-screen radial gradient several times a
   frame is genuinely expensive, stamping a cached 256px sprite is nearly
   free — and this has to hold 60fps while the machine is also transcribing
   speech. */
let nebulaSprite = null;
let clouds = [];

function buildNebulaSprite() {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grad.addColorStop(0.00, rgba(0.42, 0.85));
  grad.addColorStop(0.35, rgba(0.16, 0.7));
  grad.addColorStop(0.70, rgba(0.05, 0.5));
  grad.addColorStop(1.00, rgba(0, 0.4));
  g.fillStyle = grad;
  g.fillRect(0, 0, S, S);
  nebulaSprite = c;
}

function buildClouds() {
  clouds = [];
  if (!CONFIG.nebula) return;
  const short = Math.min(W, H);
  for (let i = 0; i < CONFIG.nebulaCount; i++) {
    clouds.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: short * (0.35 + Math.random() * 0.55),
      a: 0.05 + Math.random() * 0.07,       // deliberately barely there
      vx: (Math.random() - 0.5) * 5,        // px/s — slower than the stars
      vy: (Math.random() - 0.5) * 4,
      br: 0.5 + Math.random() * 1.1,        // breathing speed
      ph: Math.random() * TAU,
      rot: Math.random() * TAU,
      spin: (Math.random() - 0.5) * 0.03
    });
  }
}

function drawNebula(dt, t) {
  if (!CONFIG.nebula || !clouds.length || !nebulaSprite) return;
  /* the clouds swell a little when there's something happening, so the whole
     background breathes with the assistant rather than ignoring it */
  const lift = 1 + st.w.speaking * 0.55 + st.w.thinking * 0.3 + st.w.listening * 0.2;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';   // clouds add light, never occlude
  for (const c of clouds) {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.spin * dt;
    const m = c.r * 1.2;
    if (c.x < -m) c.x = W + m; else if (c.x > W + m) c.x = -m;
    if (c.y < -m) c.y = H + m; else if (c.y > H + m) c.y = -m;

    const breathe = 1 + 0.12 * Math.sin(t * c.br + c.ph);
    const r = c.r * breathe * lift;
    ctx.globalAlpha = clamp(c.a * (0.75 + 0.45 * Math.sin(t * c.br * 0.7 + c.ph)) * lift, 0, 0.22);
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.drawImage(nebulaSprite, -r, -r, r * 2, r * 2);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  ctx.restore();
}

function buildSky() {
  stars = [];
  cons = [];
  meteors = [];
  meteorNextAt = 0;
  if (!nebulaSprite) buildNebulaSprite();
  buildClouds();
  for (let i = 0; i < CONFIG.particles; i++) {
    const z = Math.random();
    /* a handful of genuinely bright ones. An even field of identical dots
       reads as noise or as dust; a sky needs a few stars your eye can
       actually land on, and the rest as depth behind them. */
    const bright = Math.random() < 0.09;
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      z,
      r: (0.4 + z * 1.5) * (bright ? 1.9 : 1),
      a: (0.14 + z * 0.42) * (bright ? 1.5 : 1),
      bright,
      tw: 0.4 + Math.random() * 1.5,   // twinkle speed, per star
      ph: Math.random() * TAU
    });
  }
}

function updateStars(dt, t) {
  const cx = W / 2, cy = H / 2;
  /* base drift: slow and slightly diagonal, like watching a long exposure */
  const driftX = -3.5, driftY = -8.0;      // px/s at z = 1
  /* the state leans: listening pulls in, speaking pushes out */
  const radial = -14 * st.w.listening + 10 * st.w.speaking;
  for (const s of stars) {
    let vx = driftX * s.z, vy = driftY * s.z;
    if (radial) {
      const dx = s.x - cx, dy = s.y - cy;
      const d = Math.hypot(dx, dy) || 1;
      vx += (dx / d) * radial * s.z;
      vy += (dy / d) * radial * s.z;
    }
    s.x += vx * dt;
    s.y += vy * dt;
    if (s.x < -6) s.x = W + 6; else if (s.x > W + 6) s.x = -6;
    if (s.y < -6) s.y = H + 6; else if (s.y > H + 6) s.y = -6;
  }
}

function drawStars(t) {
  if (!stars.length) return;
  const cx = slot.cx, cy = slot.cy;
  const R = slot.R;
  /* activity brightens the sky immediately around the presence, so the
     centre feels like the source of the light */
  const activity = st.w.speaking * 0.8 + st.w.listening * 0.5 + st.w.thinking * 0.4;
  const twinkleRate = 1 + st.w.thinking * 0.7;    // thought quickens the sky
  for (const s of stars) {
    const tw = 0.62 + 0.38 * Math.sin(t * s.tw * twinkleRate + s.ph);
    let a = s.a * tw;
    if (activity > 0.02) {
      const d = Math.hypot(s.x - cx, s.y - cy);
      a += activity * 0.28 * clamp(1 - d / (R * 3), 0, 1) * s.z;
    }
    a = clamp(a, 0, 0.85);
    /* the bright ones carry a soft halo, which is what makes a dot look like
       a light source rather than a pixel. Only ~9% of them, so the cost is
       small and the sky still reads as mostly depth. */
    if (s.bright) {
      const h = s.r * 5;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, h);
      g.addColorStop(0, rgba(a * 0.5, 0.45));
      g.addColorStop(1, rgba(0, 0.45));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(s.x, s.y, h, 0, TAU);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fillStyle = rgba(a, 0.3);
    ctx.fill();
  }
}

/* --- constellations ---
   A figure is a short chain of real, still-drifting stars, so its lines
   move with the sky. It fades in, holds, fades out. While thinking they
   spawn faster and prefer the band around the presence — the visible act
   of connecting the dots. */
function trySpawnConstellation(dt, now) {
  if (!CONFIG.constellations || stars.length < 20) return;
  const think = st.w.thinking;
  if (cons.length >= 2 + Math.round(think * 2)) return;
  const rate = 0.10 + think * 0.55;          // expected spawns per second
  if (Math.random() > rate * dt) return;

  const Rlink = Math.min(W, H) * 0.17;
  const R = Math.min(W, H) * CONFIG.size;
  let anchor = null;
  for (let tries = 0; tries < 14 && !anchor; tries++) {
    const s = stars[(Math.random() * stars.length) | 0];
    if (s.z < 0.45) continue;                // only near, bright stars anchor
    if (think > 0.4) {
      const d = Math.hypot(s.x - W / 2, s.y - H / 2);
      if (d < R * 1.5 || d > R * 4.5) continue;
    }
    anchor = s;
  }
  if (!anchor) return;

  const chain = [anchor];
  let cur = anchor;
  const hops = 2 + ((Math.random() * 3) | 0);
  for (let h = 0; h < hops; h++) {
    let best = null, bd = Infinity;
    for (const s of stars) {
      if (s.z < 0.35 || chain.includes(s)) continue;
      const d = Math.hypot(s.x - cur.x, s.y - cur.y);
      if (d > 24 && d < Rlink && d < bd) { bd = d; best = s; }
    }
    if (!best) break;
    chain.push(best);
    cur = best;
  }
  if (chain.length < 3) return;
  cons.push({ chain, t0: now, hold: 3500 + Math.random() * 3500, Rlink, dieAt: 0 });
}

function drawConstellations(now) {
  if (!cons.length) return;
  const think = st.w.thinking;
  const IN = 1600, OUT = 2600;
  for (let i = cons.length - 1; i >= 0; i--) {
    const c = cons[i];
    const age = now - c.t0;
    let env;
    if (age < IN) env = age / IN;
    else if (age < IN + c.hold) env = 1;
    else env = 1 - (age - IN - c.hold) / OUT;
    if (env <= 0) { cons.splice(i, 1); continue; }

    /* if the drift has stretched a link too far (usually a star wrapping
       to the far edge), let the figure die fast rather than draw a line
       across the whole screen */
    if (!c.dieAt) {
      for (let k = 1; k < c.chain.length; k++) {
        const a = c.chain[k - 1], b = c.chain[k];
        if (Math.hypot(a.x - b.x, a.y - b.y) > c.Rlink * 1.9) { c.dieAt = now; break; }
      }
    }
    if (c.dieAt) {
      env *= clamp(1 - (now - c.dieAt) / 700, 0, 1);
      if (env <= 0) { cons.splice(i, 1); continue; }
    }

    const lineA = env * (0.16 + 0.22 * think);
    ctx.beginPath();
    ctx.moveTo(c.chain[0].x, c.chain[0].y);
    for (let k = 1; k < c.chain.length; k++) ctx.lineTo(c.chain[k].x, c.chain[k].y);
    ctx.lineWidth = 1;
    ctx.strokeStyle = rgba(lineA, 0.55);
    ctx.stroke();
    /* linked stars glow a touch brighter than the field */
    for (const s of c.chain) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r + 0.6, 0, TAU);
      ctx.fillStyle = rgba(env * 0.5, 0.35);
      ctx.fill();
    }
  }
}

/* --- shooting stars ---
   They cross the WHOLE screen now, corner to corner, starting off the edge
   and leaving by the far side. The earlier version started somewhere in the
   top third and faded out partway across, which read less like a meteor and
   more like a scratch on the screen.

   Frequency is a judgement call: too rare and nobody ever sees one, which
   means the work is wasted; too frequent and it stops being a delight and
   starts being weather. Every 8–20 seconds, with an occasional second one
   chasing the first, is the line. */
function spawnMeteor(now, delay = 0) {
  const short = Math.min(W, H);
  const down = Math.random() < 0.75;          // most fall, some rise
  const ltr = Math.random() < 0.5;
  const ang = (down ? 1 : -1) * (0.22 + Math.random() * 0.30);   // radians off horizontal
  const speed = short * (1.5 + Math.random() * 0.9);            // px/s
  const vx = (ltr ? 1 : -1) * speed * Math.cos(ang);
  const vy = speed * Math.sin(ang);
  /* start off-screen on the entry side, at a height that leaves room to
     travel — so the streak is always a full crossing, never a stub */
  const margin = short * 0.25;
  const x = ltr ? -margin : W + margin;
  const y = down ? H * (-0.1 + Math.random() * 0.55)
                 : H * (0.45 + Math.random() * 0.65);
  const dur = (Math.hypot(W + margin * 2, H) / speed) * 1000;
  meteors.push({
    x, y, vx, vy, t0: now + delay, dur,
    len: 150 + Math.random() * 220,
    peak: 0.45 + Math.random() * 0.35
  });
}

function drawMeteor(now) {
  if (!CONFIG.shootingStars) return;
  if (!meteorNextAt) meteorNextAt = now + 3000 + Math.random() * 6000;
  if (now >= meteorNextAt && meteors.length < 3) {
    spawnMeteor(now);
    if (Math.random() < 0.28) spawnMeteor(now, 250 + Math.random() * 500);
    meteorNextAt = now + 8000 + Math.random() * 12000;
  }

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    if (now < m.t0) continue;                 // queued, not launched yet
    const p = (now - m.t0) / m.dur;
    if (p >= 1) { meteors.splice(i, 1); continue; }

    const el = (now - m.t0) / 1000;
    const hx = m.x + m.vx * el;
    const hy = m.y + m.vy * el;
    const sp = Math.hypot(m.vx, m.vy) || 1;
    const tx = hx - (m.vx / sp) * m.len;
    const ty = hy - (m.vy / sp) * m.len;
    /* fade in and out at the edges so it enters and leaves the frame rather
       than switching on in the middle of the sky */
    const a = Math.sin(Math.PI * clamp(p, 0, 1)) * m.peak;
    if (a <= 0.01) continue;

    const g = ctx.createLinearGradient(tx, ty, hx, hy);
    g.addColorStop(0, rgba(0, 0.3));
    g.addColorStop(0.75, rgba(a * 0.5, 0.3));
    g.addColorStop(1, rgba(a, 0.2));
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(hx, hy);
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.strokeStyle = g;
    ctx.stroke();

    /* a small bloom at the head, so it looks lit rather than drawn */
    const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, 9);
    hg.addColorStop(0, rgba(a, 0.1));
    hg.addColorStop(1, rgba(0, 0.1));
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(hx, hy, 9, 0, TAU);
    ctx.fill();
  }
}

/* ------------------------------------------------------------------
   THE PRESENCE — the thing in the middle. This is the part worth
   rewriting if you want your interface to look like yours.

   It gets (ctx, s) where s is:
     s.cx, s.cy   centre of the screen
     s.R          base radius in pixels
     s.t          seconds since load
     s.level      0..1 live loudness
     s.wave       64 floats, roughly -1..1
     s.w          { idle, listening, thinking, speaking } eased 0..1 weights
     s.rgba(a,tint) colour helper built from your accent

   Draw whatever you want. If you replace it and your version throws,
   the default below takes over again — a broken experiment can't leave
   you with a black screen.
------------------------------------------------------------------ */
/* One closed, smooth outline. Two things keep it from looking like a
   spiked star: we use the waveform's *envelope* (how loud, not the raw
   sample, which flips sign between neighbours), and we blur that envelope
   around the circle before drawing it. */
const RING_N = 128;
const ringEnv = new Float32Array(RING_N);
const ringTmp = new Float32Array(RING_N);

function buildEnvelope(wave) {
  const L = wave.length;
  for (let i = 0; i < RING_N; i++) {
    // mirror the samples across the vertical axis so the ends meet seamlessly
    const f = Math.abs((i / RING_N) * 2 - 1) * (L - 1);
    const i0 = Math.floor(f), i1 = Math.min(i0 + 1, L - 1);
    const v = lerp(Math.abs(wave[i0] || 0), Math.abs(wave[i1] || 0), f - i0);
    ringTmp[i] = v;
  }
  // three wrap-around smoothing passes — cheap, and it's what turns spikes
  // into swells
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < RING_N; i++) {
      const a = ringTmp[(i - 1 + RING_N) % RING_N];
      const b = ringTmp[i];
      const c = ringTmp[(i + 1) % RING_N];
      ringEnv[i] = (a + b * 2 + c) * 0.25;
    }
    ringTmp.set(ringEnv);
  }
}

function presenceRing(ctx, s) {
  const { cx, cy, R, t, w } = s;
  const speak = w.speaking, listen = w.listening, think = w.thinking;

  // breathing — always present, strongest when idle
  const breathe = Math.sin(t * 0.9) * 0.022 * (0.4 + w.idle * 0.6);
  const amp = 0.34 * speak + 0.10 * listen + 0.03;
  const base = R * (1 + breathe) * (1 - 0.05 * listen);

  // soft halo
  const glow = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 2.6);
  glow.addColorStop(0, s.rgba(0.13 + 0.22 * speak + 0.06 * listen));
  glow.addColorStop(0.4, s.rgba(0.04 + 0.07 * speak));
  glow.addColorStop(1, s.rgba(0));
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 2.6, 0, TAU);
  ctx.fill();

  buildEnvelope(s.wave);

  // a slow organic wobble so it is never a dead perfect circle
  const pts = [];
  const spin = t * 0.16;
  for (let i = 0; i < RING_N; i++) {
    const a = (i / RING_N) * TAU - Math.PI / 2;
    const organic = Math.sin(a * 3 + t * 0.7) * 0.012 + Math.sin(a * 5 - t * 0.45) * 0.008;
    const r = base * (1 + ringEnv[i] * amp + organic);
    pts.push([cx + Math.cos(a + spin) * r, cy + Math.sin(a + spin) * r]);
  }

  // draw through midpoints with quadratic curves — a closed, continuous line
  ctx.beginPath();
  let [px, py] = pts[RING_N - 1];
  ctx.moveTo((px + pts[0][0]) / 2, (py + pts[0][1]) / 2);
  for (let i = 0; i < RING_N; i++) {
    const [x, y] = pts[i];
    const [nx, ny] = pts[(i + 1) % RING_N];
    ctx.quadraticCurveTo(x, y, (x + nx) / 2, (y + ny) / 2);
  }
  ctx.closePath();
  ctx.lineJoin = 'round';
  ctx.lineWidth = 1.5 + 1.2 * speak;
  ctx.strokeStyle = s.rgba(0.5 + 0.42 * speak);
  ctx.shadowColor = s.rgba(0.75);
  ctx.shadowBlur = 16 + 26 * speak;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // a fainter echo ring, for depth
  ctx.beginPath();
  ctx.arc(cx, cy, base * 1.30, 0, TAU);
  ctx.lineWidth = 1;
  ctx.strokeStyle = s.rgba(0.10 + 0.10 * speak);
  ctx.stroke();

  // the core — a soft gradient, never a hard disc
  const coreR = base * (0.62 + 0.06 * s.level);
  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
  core.addColorStop(0, s.rgba(0.22 + 0.24 * speak, 0.55));
  core.addColorStop(0.55, s.rgba(0.06 + 0.08 * speak, 0.8));
  core.addColorStop(1, s.rgba(0));
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(cx, cy, coreR, 0, TAU);
  ctx.fill();

  // thinking — arcs orbiting outside the ring, plus small motes riding
  // between them: satellites tracing the orbit while the dots connect
  if (think > 0.01) {
    for (let i = 0; i < 3; i++) {
      const rr = base * (1.22 + i * 0.13);
      const sp = (i % 2 ? -1 : 1) * (0.5 + i * 0.28);
      const a0 = t * sp + i * 2.1;
      ctx.beginPath();
      ctx.arc(cx, cy, rr, a0, a0 + 0.7 + 0.25 * i);
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = s.rgba(think * (0.5 - i * 0.11));
      ctx.stroke();
    }
    for (let i = 0; i < 5; i++) {
      const rr = base * (1.20 + (i % 3) * 0.14);
      const ang = t * (i % 2 ? -0.9 : 0.7) + i * 1.7;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr, 1.3, 0, TAU);
      ctx.fillStyle = s.rgba(think * 0.55, 0.4);
      ctx.fill();
    }
  }

  // listening — ripples CONTRACTING onto the ring. Inward = taking in;
  // the mirror of speech, which radiates out. Two, phase-offset, so one is
  // always somewhere mid-journey.
  if (listen > 0.01) {
    for (let k = 0; k < 2; k++) {
      const ph = (t * 0.55 + k * 0.5) % 1;
      const rr = base * (1.9 - ph * 0.9);
      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, TAU);
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = s.rgba(listen * 0.32 * Math.sin(Math.PI * ph));
      ctx.stroke();
    }
  }
}

function presenceOrb(ctx, s) {
  const { cx, cy, R, t, w } = s;
  const puff = 1 + 0.16 * w.speaking * s.level + Math.sin(t * 1.1) * 0.02;
  for (let i = 5; i >= 0; i--) {
    const rr = R * puff * (0.5 + i * 0.16);
    const g = ctx.createRadialGradient(cx, cy, rr * 0.2, cx, cy, rr);
    g.addColorStop(0, s.rgba(0.10 + 0.10 * w.speaking));
    g.addColorStop(1, s.rgba(0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, rr, 0, TAU);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.44 * puff, 0, TAU);
  ctx.fillStyle = s.rgba(0.55 + 0.35 * w.speaking, 0.35);
  ctx.shadowColor = s.rgba(0.8);
  ctx.shadowBlur = 40;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function presenceBars(ctx, s) {
  const { cx, cy, R, w } = s;
  const n = 48, gap = R * 2.4 / n;
  const amp = R * (0.16 + 0.9 * w.speaking + 0.18 * w.listening);
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const v = Math.abs(s.wave[Math.floor(i / n * s.wave.length)] || 0);
    const fall = 1 - Math.abs(i / (n - 1) - 0.5) * 1.3;
    const h = Math.max(2, (0.06 + v) * amp * fall);
    const x = cx - R * 1.2 + i * gap + gap / 2;
    ctx.beginPath();
    ctx.moveTo(x, cy - h);
    ctx.lineTo(x, cy + h);
    ctx.lineWidth = Math.max(1.5, gap * 0.42);
    ctx.strokeStyle = s.rgba(0.30 + 0.45 * fall);
    ctx.stroke();
  }
}

const BUILTIN = { ring: presenceRing, orb: presenceOrb, bars: presenceBars };
let customBroken = false;

function drawPresence(ctx, s) {
  // A custom presence (window.PRESENCE, e.g. from presence.js) wins — but if
  // it throws we fall back permanently and say so, rather than showing black.
  if (typeof window.PRESENCE === 'function' && !customBroken) {
    try { window.PRESENCE(ctx, s); return; }
    catch (err) {
      customBroken = true;
      console.error('custom presence failed, using the built-in one:', err);
      setNotice('custom presence failed — see console');
    }
  }
  (BUILTIN[CONFIG.presence] || presenceRing)(ctx, s);
}

/* ------------------------------------------------------------------
   CHAT — conversation view + text input.

   The conversation itself comes from the poll (`conversation` on /state,
   oldest first); typing POSTs {"text": ...} to CONFIG.sendTo. A local
   bubble shows the instant you send, and dissolves when the same line
   echoes back through the poll, so nothing ever doubles up. If nothing
   answers the POST, the bubble stays — dimmed and dashed — with a note,
   because a silent miss is worse than an ugly one.
------------------------------------------------------------------ */
const chat = (() => {
  const root = document.getElementById('chat');
  const log = document.getElementById('log');
  const input = document.getElementById('chatin');
  const note = document.getElementById('chatnote');
  if (!CONFIG.showChat) {
    root.style.display = 'none';
    return { sync() {}, demoPush() {}, demoClear() {}, tick() {}, send() {}, input };
  }
  input.placeholder = LABELS.chatPlaceholder;

  /* awake/receded: the panel earns the foreground only when in use */
  let awakeUntil = 0, hovering = false;
  function wake(ms = 9000) {
    awakeUntil = Math.max(awakeUntil, performance.now() + ms);
    root.classList.add('awake');
  }
  root.addEventListener('mouseenter', () => { hovering = true; wake(4000); });
  root.addEventListener('mouseleave', () => { hovering = false; });
  input.addEventListener('focus', () => wake());
  input.addEventListener('input', () => wake());
  function tick() {        // called once a second from the chrome timer
    if (performance.now() > awakeUntil && !hovering && document.activeElement !== input && !input.value) {
      root.classList.remove('awake');
    }
  }

  let noteTimer = 0;
  function showNote(text) {
    note.textContent = text;
    note.classList.add('on');
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => note.classList.remove('on'), 4000);
  }

  const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  function pin(wasNear) { if (wasNear) log.scrollTop = log.scrollHeight; }

  function bubble(role, text) {
    const b = document.createElement('div');
    b.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    b.textContent = text;
    /* two frames so the entrance transition actually plays */
    requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('in')));
    return b;
  }

  /* --- live conversation, synced from the poll --- */
  const pendings = [];             // local echoes waiting for the server copy
  let lastKey = '';
  function sync(list) {
    /* a user line coming back from the source retires its local echo
       (matched on exact text — good enough for a starter, and honest) */
    for (const m of list) {
      if (m.role !== 'user') continue;
      const i = pendings.findIndex(p => p.text === m.text);
      if (i >= 0) { pendings[i].el.remove(); pendings.splice(i, 1); }
    }
    const shown = list.slice(-40);
    const key = JSON.stringify(shown);
    if (key === lastKey) return;             // nothing new — don't touch the DOM
    lastKey = key;
    const wasNear = nearBottom();
    log.innerHTML = '';
    for (const m of shown) {
      const b = bubble(m.role === 'user' ? 'user' : 'ai', String(m.text || ''));
      b.classList.add('in');                 // already-read history doesn't animate
      log.appendChild(b);
    }
    for (const p of pendings) log.appendChild(p.el);   // unechoed sends stay last
    pin(true);
    if (shown.length) wake();
    if (wasNear) log.scrollTop = log.scrollHeight;
  }

  /* --- demo exchange: bubbles tagged .demo, wiped each demo cycle --- */
  function demoPush(role, text) {
    if (!st.demo) return;
    const wasNear = nearBottom();
    const b = bubble(role, text);
    b.classList.add('demo');
    log.appendChild(b);
    pin(wasNear);
    wake(6000);
  }
  function demoClear() {
    for (const el of log.querySelectorAll('.demo')) el.remove();
  }

  /* --- sending --- */
  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    const el = bubble('user', text);
    el.classList.add('pending');
    log.appendChild(el);
    pin(true);
    wake();
    try {
      const r = await fetch(CONFIG.sendTo, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      if (!r.ok) throw new Error(r.status);
      el.classList.remove('pending');
      pendings.push({ text, el });
    } catch (e) {
      el.classList.remove('pending');
      el.classList.add('failed');
      showNote(LABELS.chatOffline);
    }
  }
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); send(); }
    e.stopPropagation();       // typing must never trigger page-level keys
  });

  return { sync, demoPush, demoClear, tick, send, input };
})();

/* ------------------------------------------------------------------
   THE PANEL — the working surface around the presence.

   The first version of this file was a face and nothing else: fine on a
   spare monitor, useless to someone with one screen, because all they
   could do was talk at it. So the face is now one card among several:

     today's goal · waiting on you · quick note      (left)
     the stage, its shelf, and "what I'm doing now"   (middle)
     remembered today · the conversation              (right)

   Everything shown comes from the same poll as the state. The source may
   add a `panel` object to its JSON; every field is optional, and a field
   that is absent just leaves that card as it was:

     panel: {
       goal:     { text, done },
       waiting:  ["...", ...],
       open:     ["...", ...],
       activity: { text, busy },
       memory:   [{ t: "14:02", text: "..." }, ...]      newest first
       stage:    { seq, kind, title, ... }               see show() below
     }

   With no source at all it plays a scripted demo, and says so.
------------------------------------------------------------------ */
const panel = (() => {
  const $ = id => document.getElementById(id);
  const el = (tag, text, cls) => {
    const n = document.createElement(tag);
    if (text != null) n.textContent = text;
    if (cls) n.className = cls;
    return n;
  };
  const nowHM = () => {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  };

  /* --- the words on the cards, from LABELS so they translate in one place --- */
  $('goalLbl').textContent = LABELS.goal;
  $('waitLbl').textContent = LABELS.waiting;
  $('noteLbl').textContent = LABELS.note;
  $('noteIn').placeholder = LABELS.notePlaceholder;
  $('stageLbl').textContent = LABELS.stage;
  $('doingLbl').textContent = LABELS.doing;
  $('memLbl').textContent = LABELS.memory;
  $('chatLbl').textContent = LABELS.chat;

  const data = { goal: '', goalDone: false, waiting: [], open: [], memory: [] };
  let live = false;                 // true once a real source has sent panel data

  /* --- goal --- */
  function setGoal(text, done) {
    data.goal = text || '';
    data.goalDone = !!done;
    $('goalText').textContent = data.goal || LABELS.goalEmpty;
    $('goal').classList.toggle('done', data.goalDone && !!data.goal);
  }
  $('goalDone').addEventListener('click', () => {
    if (!data.goal) return;
    setGoal(data.goal, !data.goalDone);
    if (!st.demo && data.goalDone) post(LABELS.goalDoneMsg);
  });

  /* --- lists --- */
  function fill(ul, items, build, emptyText) {
    ul.innerHTML = '';
    if (!items.length) { ul.appendChild(el('li', emptyText, 'empty')); return; }
    for (const it of items) ul.appendChild(build(it));
  }
  function setWaiting(list) {
    data.waiting = list.slice(0, 12);
    $('waitLbl').innerHTML = '';
    $('waitLbl').append(LABELS.waiting, el('i', data.waiting.length ? String(data.waiting.length) : ''));
    fill($('waitList'), data.waiting, t => el('li', String(t)), LABELS.waitingEmpty);
  }
  function setMemory(list) {
    data.memory = list.slice(0, 30);
    $('memLbl').innerHTML = '';
    $('memLbl').append(LABELS.memory, el('i', data.memory.length ? String(data.memory.length) : ''));
    fill($('memList'), data.memory, m => {
      const li = el('li');
      li.append(el('b', m.t || ''), el('span', String(m.text || '')));
      return li;
    }, LABELS.memoryEmpty);
  }
  function addMemory(text, t) {
    setMemory([{ t: t || nowHM(), text }].concat(data.memory));
    $('memList').scrollTop = 0;
  }

  /* --- "what I'm doing now" --- */
  let lastDoing = null;
  function setActivity(text, busy) {
    const shown = text || LABELS.doingIdle;
    $('doing').classList.toggle('busy', !!busy && !!text);
    if (shown === lastDoing) return;
    lastDoing = shown;
    const t = $('doingText');
    t.textContent = shown;
    t.classList.remove('swap');
    void t.offsetWidth;                   // restart the little entrance
    t.classList.add('swap');
  }

  /* ----------------------------------------------------------------
     THE STAGE — where the assistant shows what it just made. An item is
     one of:
       { kind: "text",  title, heading, body: ["paragraph", ...] }
       { kind: "rows",  title, heading, rows: [["09:00", "..."], ...] }
       { kind: "image", title, src }
       { kind: "page",  title, src }        a page it wrote, by address
       { kind: "page",  title, html }       or handed over whole
     Whatever is shown also lands on the shelf underneath, so a thing
     that was shown once can be brought back with a click.
  ---------------------------------------------------------------- */
  const shelf = [];
  let current = null;

  function sheetFor(item) {
    const s = el('div', null, 'sheet');
    if (item.kind === 'brief') return briefSheet(s);
    if (item.kind === 'image') { const i = el('img'); i.src = item.src; i.alt = item.title || ''; s.appendChild(i); return s; }
    if (item.kind === 'page') {
      s.classList.add('frame');
      const f = el('iframe');
      f.setAttribute('sandbox', 'allow-scripts');
      if (item.html) f.srcdoc = item.html; else f.src = item.src;
      s.appendChild(f);
      return s;
    }
    if (item.heading) s.appendChild(el('h2', item.heading));
    if (item.kind === 'rows') {
      const box = el('div', null, 'rows');
      for (const row of item.rows || []) {
        const r = el('div');
        r.append(el('b', String(row[0])), el('span', String(row[1])));
        box.appendChild(r);
      }
      s.appendChild(box);
    } else {
      for (const p of item.body || []) s.appendChild(el('p', String(p)));
    }
    return s;
  }

  /* the start-of-day brief is built here, from what the panel already knows */
  function briefSheet(s) {
    const h = new Date().getHours();
    const hello = LABELS.greet[h < 12 ? 0 : h < 18 ? 1 : 2] + (CONFIG.owner ? ', ' + CONFIG.owner : '') + '.';
    s.appendChild(el('h2', hello));
    const big = el('div', null, 'big');
    for (const [n, label] of [[data.open.length, LABELS.brief.open],
                              [data.waiting.length, LABELS.brief.waiting],
                              [data.memory.length, LABELS.brief.remembered]]) {
      const d = el('div');
      d.append(el('b', String(n)), el('span', label));
      big.appendChild(d);
    }
    s.appendChild(big);
    const rows = el('div', null, 'rows');
    const g = el('div');
    g.append(el('b', LABELS.brief.goalRow), el('span', data.goal || LABELS.goalEmpty));
    rows.appendChild(g);
    for (const o of data.open.slice(0, 5)) {
      const r = el('div');
      r.append(el('b', '·'), el('span', String(o)));
      rows.appendChild(r);
    }
    s.appendChild(rows);
    return s;
  }

  function drawShelf() {
    const box = $('shelf');
    box.innerHTML = '';
    for (const item of shelf) {
      const b = el('button');
      b.type = 'button';
      b.append(el('i', LABELS.kinds[item.kind] || item.kind), item.title || '');
      if (item === current) b.classList.add('on');
      b.addEventListener('click', () => show(item));
      box.appendChild(b);
    }
    box.scrollLeft = box.scrollWidth;
  }

  function show(item) {
    if (!item || item === current) return;
    const stage = $('stage');
    for (const old of stage.querySelectorAll('.sheet')) {
      old.classList.add('leaving');
      setTimeout(() => old.remove(), 400);
    }
    stage.appendChild(sheetFor(item));
    $('stageTitle').textContent = item.title || '';
    current = item;
    /* one entry per title: showing the same thing twice doesn't stack it */
    const at = shelf.findIndex(x => x.title === item.title && x.kind === item.kind);
    if (at >= 0) shelf.splice(at, 1);
    shelf.push(item);
    if (shelf.length > 12) shelf.shift();
    drawShelf();
  }

  /* --- sending: quick buttons and the note box go the same way typing does --- */
  async function post(text) {
    try {
      const r = await fetch(CONFIG.sendTo, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      return r.ok;
    } catch (e) { return false; }
  }

  for (const q of LABELS.quick) {
    const b = el('button', q.label);
    b.type = 'button';
    b.addEventListener('click', () => {
      if (st.demo) { demoAsk(q); return; }
      chat.input.value = q.text;
      chat.send();
    });
    $('quick').appendChild(b);
  }

  let noteTimer = 0;
  function noteSay(text) {
    const m = $('noteMsg');
    m.textContent = text;
    m.classList.add('on');
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => m.classList.remove('on'), 3500);
  }
  $('noteIn').addEventListener('keydown', async e => {
    e.stopPropagation();
    if (e.key !== 'Enter') return;
    const text = e.target.value.trim();
    if (!text) return;
    e.target.value = '';
    if (st.demo) { addMemory(text); noteSay(LABELS.noteSaved + ' · ' + LABELS.demo); return; }
    noteSay((await post(LABELS.notePrefix + text)) ? LABELS.noteSaved : LABELS.chatOffline);
  });

  /* ----------------------------------------------------------------
     LIVE — data from the source. The first real packet clears whatever
     the demo left behind, so a demo line can never pass as a real one.
  ---------------------------------------------------------------- */
  let stageSeq = null;
  function sync(p) {
    if (!live) {
      live = true;
      shelf.length = 0; current = null;
      $('stage').innerHTML = '';
      setGoal('', false); setWaiting([]); setMemory([]); setActivity('', false);
      data.open = [];
    }
    if (p.goal) setGoal(p.goal.text, p.goal.done);
    if (Array.isArray(p.waiting)) setWaiting(p.waiting);
    if (Array.isArray(p.open)) data.open = p.open;
    if (Array.isArray(p.memory)) setMemory(p.memory);
    if (p.activity) setActivity(p.activity.text, p.activity.busy);
    if (p.stage && p.stage.seq !== stageSeq) { stageSeq = p.stage.seq; show(p.stage); }
    else if (!current) show({ kind: 'brief', title: LABELS.brief.title });
  }

  /* ----------------------------------------------------------------
     DEMO — a scripted half-minute, looping, so every card can be seen
     doing its job before anything is connected.
  ---------------------------------------------------------------- */
  const DEMO = LABELS.demoPanel;
  let demoT0 = 0, demoDone = 0, demoBooted = false;

  function demoReset() {
    setGoal(DEMO.goal, false);
    setWaiting(DEMO.waiting);
    data.open = DEMO.open;
    setMemory(DEMO.memory);
    setActivity('', false);
  }

  function demoTick() {
    if (!st.demo || live) return;
    if (!demoBooted) {
      demoBooted = true;
      demoReset();
      show({ kind: 'brief', title: LABELS.brief.title });
      demoT0 = performance.now();
      demoDone = 0;
      return;
    }
    const t = (performance.now() - demoT0) / 1000;
    while (demoDone < DEMO.steps.length && DEMO.steps[demoDone].at <= t) {
      const s = DEMO.steps[demoDone++];
      if ('activity' in s) setActivity(s.activity, !!s.busy);
      if (s.memory) addMemory(s.memory);
      if (s.stage) show(s.stage);
    }
    if (t > DEMO.length) { demoT0 = performance.now(); demoDone = 0; setMemory(DEMO.memory); setActivity('', false); }
  }

  /* a quick button pressed in demo mode: play the exchange it stands for */
  function demoAsk(q) {
    chat.demoPush('user', q.text);
    setActivity(LABELS.demoThinking, true);
    st.state = 'thinking';
    demoUntil = performance.now() + 1500;
    setTimeout(() => {
      if (!st.demo) return;
      st.state = 'speaking';
      demoUntil = performance.now() + 3600;
      st.capText = q.reply; st.capDur = 3.4; st.capStart = performance.now();
      renderCaption();
      chat.demoPush('ai', q.reply);
      if (q.stage) show(q.stage);
      setActivity('', false);
    }, 1500);
  }

  /* --- once a second: the date line, the layout check, the demo --- */
  function tick() {
    const d = new Date();
    $('date').textContent = d.toLocaleDateString(LABELS.locale, { weekday: 'long', day: 'numeric', month: 'long' });
    measureSlot();          // the cards settle after the entrance; keep the presence centred
    demoTick();
  }

  /* --- the entrance --- */
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('on')));
  for (const ms of [700, 1500, 2400]) setTimeout(measureSlot, ms);

  setGoal('', false); setWaiting([]); setMemory([]); setActivity('', false);

  return { sync, tick, show };
})();


/* --- vignette + chrome --- */
function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

const stateEl = document.getElementById('statelabel');
const clockEl = document.getElementById('clock');
const noticeEl = document.getElementById('notice');
function setNotice(text) { noticeEl.textContent = text || ''; }

document.querySelector('#brand b').textContent = CONFIG.name;
if (!CONFIG.showState) stateEl.style.display = 'none';
if (!CONFIG.showClock) clockEl.style.display = 'none';

function tickChrome() {
  if (CONFIG.showClock) {
    const d = new Date();
    clockEl.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  if (CONFIG.showState) {
    stateEl.textContent = st.demo ? LABELS.demo : (LABELS[st.state] || st.state);
  } else if (st.demo) {
    /* the state line is the demo badge; if it's hidden, the notice line
       takes over — demo mode must always be visible somewhere */
    setNotice(LABELS.demo);
  } else {
    setNotice('');
  }
  chat.tick();
  panel.tick();
}
setInterval(tickChrome, 1000);
tickChrome();

/* --- the loop ---
   Capped at 60fps: rAF fires at the monitor's refresh rate (165Hz on some
   machines), and rendering every one of those frames starves the GPU that
   speech transcription also needs. The loop keeps scheduling itself but
   skips the render until a frame's worth of time has really passed;
   simulation advances off measured dt, so motion is identical at any Hz. */
const FRAME_MS = 1000 / 60;
let last = 0;
const t0 = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < FRAME_MS - 0.5) return;   // -0.5: don't drop to 55fps on timer jitter
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;

  demoStep(now);
  demoSignal(now);
  setWeights(dt);
  sweepCaption(now);

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const t = (now - t0) / 1000;
  drawNebula(dt, t);          // clouds of light first: everything sits on top
  updateStars(dt, t);
  drawStars(t);
  trySpawnConstellation(dt, now);
  drawConstellations(now);
  drawMeteor(now);

  const s = {
    cx: slot.cx,
    cy: slot.cy,
    R: slot.R,
    t,
    level: st.level,
    wave: st.wave,
    w: st.w,
    rgba
  };

  ctx.save();
  drawPresence(ctx, s);
  ctx.restore();

  drawVignette();
}

resize();
requestAnimationFrame(frame);
</script>
<!-- CUSTOM SHAPE
     If you write your own presence, it lives in a separate file next to this
     one and gets loaded by adding this line back, right here:

       <script src="presence.js"></script>

     It is deliberately NOT here by default. A <script> tag pointing at a file
     that doesn't exist throws a 404 into the console on every single load, and
     the first thing a stranger sees when they open the console is then a red
     error that isn't a problem — which teaches them to ignore real ones.
     `onerror` can't help: the browser logs the failed request either way.
     So the tag is added when the file is, and not before. -->
